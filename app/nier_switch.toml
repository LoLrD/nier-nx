log_file = "sdmc:/switch/nier-nx/nier.log"
log_level = "info"
gpu_plugin = "xenos"
nier_renderer = "native"
nier_resolution_level = 1
nier_dynamic_resolution = false
nier_level1_scale = 0.5
nier_level2_scale = 0.4
guest_memory_large_pages = 1
vulkan_robust_buffer_access = false
nier_pipeline_cache_file = "sdmc:/switch/nier-nx/pipelines.bin"
nier_shader_cache_file = "sdmc:/switch/nier-nx/shaders.bin"
readback_resolve = "fast"
readback_resolve_max_kb = 256
execute_unclipped_draw_vs_on_cpu = true
execute_unclipped_draw_vs_on_cpu_with_scissor = true
dlc_enable = true
content_marketplace_root = "sdmc:/switch/nier-nx/marketplace"

[log.levels]
gpu = "debug"
